site_name: Diseño de PCB - Proyecto KiCad
site_description: Documentación técnica del diseño y ruteo de circuito impreso.
site_author: Tu Nombre

# Integra tu repositorio (Aparecerá arriba a la derecha)
repo_url: https://github.com/Mrlogros/Produccionb-Electronica
repo_name: Mrlogros/Produccionb-Electronica

nav:
  - Inicio: index.md
  - 1. Diseño del Esquemático: esquematico.md
  - 2. Editor de Placas (Layout): editor-placas.md
  - 3. Mods CE y Ajustes: mods-ce.md
  - 4. Recursos para Aprender: recursos.md

theme:
  name: material
  # Logo y Favicon de placa base
  logo: material/circuit-board
  favicon: material/circuit-board
  # Tipografía moderna de Google Fonts
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant # Transiciones "smooth" sin recargar la página (SPA)
    - navigation.tracking # Actualiza la URL automáticamente al hacer scroll
    - navigation.tabs # Crea un menú superior moderno
    - navigation.tabs.sticky # El menú superior te sigue al bajar
    - navigation.sections # Agrupa secciones lateralmente de forma limpia
    - navigation.top # Botón flotante para volver arriba
    - content.code.copy # Botón para copiar comandos fácilmente
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
