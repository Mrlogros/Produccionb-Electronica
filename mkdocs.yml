site_name: Diseño de PCB - Proyecto KiCad
site_description: Documentación técnica del diseño y ruteo de circuito impreso.
site_author: Tu Nombre

repo_url: https://github.com/Mrlogros/Produccionb-Electronica
repo_name: Mrlogros/Produccionb-Electronica

# Menú agrupado para forzar las pestañas superiores modernas
nav:
  - Inicio: index.md
  - Desarrollo de PCB:
    - 1. Diseño del Esquemático: esquematico.md
    - 2. Editor de Placas (Layout): editor-placas.md
    - 3. Mods CE y Ajustes: mods-ce.md
  - Referencias: recursos.md

theme:
  name: material
  # Corrección del logo e ícono
  icon:
    logo: material/developer-board
  favicon: material/developer-board
  # Tipografía moderna y limpia
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs 
    - navigation.tabs.sticky
    - navigation.top
    - toc.integrate # Mueve el índice derecho al menú izquierdo
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black # Barra superior negra para un look más "stealth"
      accent: red # Detalles y enlaces en rojo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - admonition
  - attr_list
  - md_in_html

# Aquí llamamos a nuestro archivo de estilos personalizados
extra_css:
  - stylesheets/custom.css
